<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="keywords" content="capeline,edenvale hotel,capeline resort,capeline hotel">
  <link rel="stylesheet" href="bookings.css">
  <link rel="icon" type="image/png" href="Images/favicon.ico">
  <title>Capeline Booking</title>
</head>
<body>
  <header>
    <nav id="navibar">
      <div class="container">
        <img src="https://lh3.googleusercontent.com/pw/AP1GczMaa_5md7NjMPuN08nTC4MRTRPQIRW4Exe31x-LLlfLsmJOeO0cxqkwW80hCa8iNuySdeK6DWAEt-99-X4mhP5jOcBjl2ZuJGxO15Gbvmnxgh9SWSbPfINv3nqCwytOMnvxmisWld2QSVQ8Imlrhow=w121-h118-s-no-gm?authuser=0" width="55">
        <ul>
          <li><a href="https://capeline26.github.io/resort/">Home</a></li>
           <li><a class="current" href="index.html">Hotels</a></li>
           <li><a href="about.html">About Us</a></li>
          <li><a href="contact.html">Contact Us</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <p>
    Make your booking here:<br>
    <table>
      <tr>
        <th>Avail Room No.</th>
        <th>Room Type</th>
        <th>Price per night</th>
      </tr>
      <tr>
        <td>#14</td>
        <td>Classic</td>
        <td>R930</td>
      </tr>
      <tr>
        <td>#19</td>
        <td>Luxury</td>
        <td>R1210</td>
      </tr>
    </table> 
    <br>
    
    <form id="bookingForm">
      <label>Name and surname </label>
      <input id="fullName" name="Name and surname" type="text" required><br>
      
      <label>Email</label>
      <input id="email" name="Email" type="email" required><br>
      
      <label>Check in date </label>
      <input id="checkIn" name="Check in date" type="date" required><br>
      
      <label>Check out date</label>
      <input id="checkOut" name="Check out date" type="date" required><br>
      
      <label>Room Number </label>
      <select id="roomNumber" name="Room Number" class="border border-gray-300 rounded-lg p-2.5 w-full focus:outline-none focus:ring focus:ring-blue-500">
        <option value="#14">#14</option>
        <option value="#19">#19</option>
      </select><br>
      
      <button type="submit" class="btn">Submit</button>
    </form>  
  </p>

  <footer class="main-footer">
    <p>Capeline Resort &copy;, 2025</p>
  </footer>

  <!-- Firebase Modular SDK Scripts -->
  <script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://gstatic.com";

    // ⚠️ TODO: REPLACE THIS OBJECT WITH YOUR ACTUAL FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_://firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_://appspot.com",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Form submission event handler
    document.getElementById("bookingForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      // Collect data fields
      const bookingData = {
        name: document.getElementById("fullName").value,
        email: document.getElementById("email").value,
        checkInDate: document.getElementById("checkIn").value,
        checkOutDate: document.getElementById("checkOut").value,
        roomNumber: document.getElementById("roomNumber").value,
        createdAt: serverTimestamp() // Adds exact arrival date/time to DB
      };

      try {
        // Saves a new document into a collection called "bookings"
        await addDoc(collection(db, "bookings"), bookingData);
        alert("🎉 Booking successfully submitted!");
        document.getElementById("bookingForm").reset();
      } catch (error) {
        console.error("Error saving booking: ", error);
        alert("❌ Error sending booking. Please try again.");
      }
    });
  </script>
</body>
</html>
